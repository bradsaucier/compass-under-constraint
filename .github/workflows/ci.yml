name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate portfolio
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Compile source files
        run: python -m compileall -q GameExperience.py TreasureMaze.py

      - name: Validate notebook format
        run: python -c "import nbformat; notebook = nbformat.read('Saucier_Bradley_ProjectTwo.ipynb', as_version=4); nbformat.validate(notebook)"

      - name: Run focused tests
        run: python -m pytest -q
